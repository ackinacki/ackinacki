- name: upgrade block manager services
  gather_facts: no
  hosts: block_manager
  # One block-manager at a time: each one closes its history proofs store gap
  # from the others before the next one stops (CLOSE_HISTORY_GAPS).
  serial: "{{ bm_update_batch_size | default(1) }}"
  become: yes
  # Force handlers is needed for asserts
  force_handlers: True
  any_errors_fatal: true
  vars:
    DO_START: yes
    DO_STOP_GRACEFUL: yes
    ENABLE_CHECKER: yes
    ENABLE_UPDATE: yes
    GS_WAIT: true
    CLOSE_HISTORY_GAPS: yes
    UPGRADE:
      - block-manager # grsh + down + up
      - logrotate     # up + lr restart
#    DO_ROTATE: true
#    ROTATE_DB_CHECK: true
#    RESTORE_ROTATED: true
  roles:
    - role: block-manager
      when: ENABLE_UPDATE is true
